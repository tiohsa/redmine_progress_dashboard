name: E2E

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  dashboard-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start Redmine and DB
        run: docker compose -f .github/e2e/docker-compose.yml up -d

      - name: Wait for Redmine
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3002/login > /dev/null; then
              echo "Redmine is ready"
              exit 0
            fi
            echo "Waiting for Redmine... (${i}/60)"
            sleep 5
          done
          echo "Redmine did not become ready in time"
          docker compose -f .github/e2e/docker-compose.yml logs --tail=200
          exit 1

      - name: Load Redmine default data
        run: |
          docker compose -f .github/e2e/docker-compose.yml exec -T redmine \
            bash -lc "RAILS_ENV=production REDMINE_LANG=en bundle exec rake redmine:load_default_data"

      - name: Seed E2E data
        run: |
          docker compose -f .github/e2e/docker-compose.yml exec -T redmine \
            bash -lc "bundle exec rails runner -e production /usr/src/redmine/plugins/redmine_progress_dashboard/.github/e2e/setup_redmine.rb"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: .github/e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: .github/e2e
        run: npm ci

      - name: Install Playwright browser
        working-directory: .github/e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        working-directory: .github/e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:3002
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: .github/e2e/playwright-report
          if-no-files-found: ignore

      - name: Show container logs
        if: failure()
        run: docker compose -f .github/e2e/docker-compose.yml logs --tail=200

      - name: Stop containers
        if: always()
        run: docker compose -f .github/e2e/docker-compose.yml down -v
